# Renewable Energy Orchestrator — asset & market configuration (the default industry profile).
name: Default portfolio
# Units: power MW, energy MWh, prices ₹/MWh, carbon tCO2/MWh, time in 15-min ticks.

sim:
  tick_minutes: 15
  ticks_per_day: 96
  timezone: Asia/Kolkata
  frequency_nominal_hz: 50.0
  frequency_sensitivity_hz: 0.5     # Hz deviation per 100% supply/demand imbalance
  nowcast_error: 0.03               # realised vs. nowcast error on renewables (fraction)
  forecast_bias: {solar: -0.04, wind: 0.12, demand: 0.03}   # systematic NWP/model bias the agent must learn

solar_farms:   # Rajasthan / Gujarat
  - {id: S1, name: Bhadla (RJ),        capacity_mw: 60, lat: 27.54, lon: 71.92, performance_ratio: 0.90, cloud_sensitivity: 1.0}
  - {id: S2, name: Jodhpur (RJ),       capacity_mw: 45, lat: 26.24, lon: 73.02, performance_ratio: 0.88, cloud_sensitivity: 0.9}
  - {id: S3, name: Jaisalmer (RJ),     capacity_mw: 40, lat: 26.91, lon: 70.91, performance_ratio: 0.90, cloud_sensitivity: 0.8}
  - {id: S4, name: Charanka (GJ),      capacity_mw: 30, lat: 23.90, lon: 71.20, performance_ratio: 0.87, cloud_sensitivity: 1.1}
  - {id: S5, name: Dholera (GJ),       capacity_mw: 20, lat: 22.25, lon: 72.19, performance_ratio: 0.86, cloud_sensitivity: 1.2}

wind_farms:    # Gujarat / Tamil Nadu — hub-height (100 m) power curves
  - {id: W1, name: Kutch (GJ),         capacity_mw: 80, lat: 23.25, lon: 69.67, cut_in_ms: 3.0, rated_ms: 12.0, cut_out_ms: 25.0}
  - {id: W2, name: Muppandal (TN),     capacity_mw: 50, lat: 8.26,  lon: 77.55, cut_in_ms: 3.5, rated_ms: 12.5, cut_out_ms: 25.0}
  - {id: W3, name: Dwarka (GJ),        capacity_mw: 30, lat: 22.24, lon: 68.97, cut_in_ms: 3.0, rated_ms: 11.5, cut_out_ms: 24.0}

batteries:
  - {id: B1, name: BESS-Bhadla, energy_mwh: 50,  power_mw: 25, round_trip_eff: 0.90, soc_min: 0.10, soc_max: 0.95, soc_init: 0.50, degradation_cost: 450}
  - {id: B2, name: BESS-Kutch,  energy_mwh: 100, power_mw: 40, round_trip_eff: 0.90, soc_min: 0.10, soc_max: 0.95, soc_init: 0.50, degradation_cost: 400}

consumers:     # base_mw = typical load; critical_frac must always be served
  - {id: C1, name: Steel mill,     base_mw: 60, critical_frac: 0.60, dr_eligible: true,  profile: industrial}
  - {id: C2, name: Cement plant,   base_mw: 45, critical_frac: 0.55, dr_eligible: true,  profile: industrial}
  - {id: C3, name: Textile park,   base_mw: 35, critical_frac: 0.55, dr_eligible: true,  profile: commercial}
  - {id: C4, name: Data centre,    base_mw: 30, critical_frac: 0.90, dr_eligible: false, profile: flat}

grid:
  import_limit_mw: 120
  export_limit_mw: 70
  carbon_intensity_t_per_mwh: 0.72   # Indian grid average

market:
  base_price: 4500             # ₹/MWh — synthetic price anchor
  buy_adder: 400               # transmission/open-access charges on imports
  sell_factor: 0.92            # export realises 92% of market price
  carbon_price: 1500           # ₹/tCO2 (shadow price)
  dr_incentive: 3500           # ₹/MWh of flexible load reduced via DR
  curtailment_penalty: 1500    # ₹/MWh — shadow cost of wasted clean energy
  voll_flexible: 20000         # ₹/MWh of non-DR flexible load shed
  voll_critical: 200000        # ₹/MWh of critical load unserved
  reserve_shortfall_penalty: 6000  # ₹/MWh-tick below reserve SoC
  deviation_penalty: 2000      # ₹/MWh balancing charge for real-time imbalance

agent:
  horizon: 16                  # optimizer look-ahead (ticks)
  llm_every_n_ticks: 8         # re-consult LLM at least this often
  max_relax_attempts: 2
  scenarios: 100               # stress-test futures per candidate plan
  explore_per_recipe: 3        # combinations tried in every recipe band (centre + spread)
  refine_candidates: 6         # extra combinations around the best one found
  recipes:                     # each parameter is a [min, max] band the AI searches inside (fractions)
                               # max_dr_frac = cap on demand response; restricting it raised cost in A/B tests
    - {name: Max savings, reserve_pct: [0.05, 0.15], w_cost: [0.58, 0.72], w_clean: [0.15, 0.25], w_reliability: [0.08, 0.22], caution: [0.0, 0.15], max_dr_frac: [1.0, 1.0]}
    - {name: Lean, reserve_pct: [0.12, 0.25], w_cost: [0.52, 0.66], w_clean: [0.14, 0.24], w_reliability: [0.15, 0.29], caution: [0.0, 0.25], max_dr_frac: [1.0, 1.0]}
    - {name: Balanced, reserve_pct: [0.22, 0.35], w_cost: [0.46, 0.6], w_clean: [0.13, 0.23], w_reliability: [0.23, 0.37], caution: [0.1, 0.35], max_dr_frac: [1.0, 1.0]}
    - {name: Green-lean, reserve_pct: [0.2, 0.4], w_cost: [0.23, 0.37], w_clean: [0.48, 0.62], w_reliability: [0.1, 0.2], caution: [0.0, 0.25], max_dr_frac: [1.0, 1.0]}
    - {name: Steady, reserve_pct: [0.32, 0.45], w_cost: [0.39, 0.53], w_clean: [0.11, 0.21], w_reliability: [0.31, 0.45], caution: [0.2, 0.5], max_dr_frac: [1.0, 1.0]}
    - {name: Cautious, reserve_pct: [0.42, 0.55], w_cost: [0.32, 0.46], w_clean: [0.1, 0.2], w_reliability: [0.39, 0.53], caution: [0.35, 0.65], max_dr_frac: [1.0, 1.0]}
    - {name: Protective, reserve_pct: [0.52, 0.68], w_cost: [0.25, 0.39], w_clean: [0.08, 0.18], w_reliability: [0.48, 0.62], caution: [0.5, 0.8], max_dr_frac: [1.0, 1.0]}
    - {name: Strong reserve, reserve_pct: [0.64, 0.8], w_cost: [0.17, 0.31], w_clean: [0.07, 0.17], w_reliability: [0.58, 0.72], caution: [0.65, 0.95], max_dr_frac: [1.0, 1.0]}
    - {name: Fortress, reserve_pct: [0.76, 0.9], w_cost: [0.09, 0.23], w_clean: [0.05, 0.15], w_reliability: [0.66, 0.8], caution: [0.8, 1.0], max_dr_frac: [1.0, 1.0]}
  learning_rate: 0.15          # EMA step for forecast-bias learning

data:
  iex_prices_csv: data/iex_prices.csv
  replay_dir: data/replay
  cache_dir: data/cache
  cache_ttl_minutes: 60
  api_timeout_s: 10
  storm_weather_codes: [95, 96, 99, 65, 67, 82]   # thunderstorm / heavy rain
  storm_wind_ms: 20.0          # alert when hub-height wind exceeds this
  learning_file: data/learning.json

targets:                       # industry goals
  annual_carbon_target_t: 250000
  target_cost_rs_per_mwh: 4500
  max_shortfall_prob: 0.02     # tolerated chance of critical-load shortfall in the next 4 h
  risk_aversion: 0.3           # 0 = only average cost matters, 1 = worst case matters as much

schedules:
  maintenance:                 # planned work; the agent may move "flexible" jobs inside their window
    - {asset: W3, start: "14:00", hours: 2, kind: maintenance, flexible_hours: 4}
  conservation:                # planned demand reduction by the industry
    - {start: "18:30", end: "20:00", reduction_pct: 5}
